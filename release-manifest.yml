# This is an allowlist. Files not listed here must not be copied from the
# private working archive into a public release without a fresh review.
release_name: ants-pose-detection
release_type: reproducibility-code
included:
  - README.md
  - LICENSE (AGPL-3.0 for code and model weights)
  - CITATION.cff
  - environment.yml
  - configs/**
  - scripts/**
  - tests/**
  - docs/**
excluded:
  - raw images and Labelbox exports
  - model checkpoints
  - production results and debug artefacts
  - OpenAI batch inputs, outputs, and logs
  - private manuscript/planning and confidential collaboration material
  - chat artefacts
  - credentials and machine-specific paths
